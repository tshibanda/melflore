[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/ressources/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/paiement"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/paiement.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
